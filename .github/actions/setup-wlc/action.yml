name: Build WLC from source
description: Build the selected WLC ref and export its executable path
inputs:
  ref:
    description: WLC branch or ref
    required: false
runs:
  using: composite
  steps:
    - name: Preserve compiler template line endings
      shell: bash
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v5
      with:
        repository: starwey604/wlc
        ref: ${{ inputs.ref || vars.WLC_REF || 'main' }}
        path: .tools/wlc
    - name: Build WLC with stable Rust
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal
        cargo +stable build --release --locked --manifest-path .tools/wlc/Cargo.toml
    - name: Export WLC executable
      shell: python
      run: |
        import os
        from pathlib import Path
        executable = Path(os.environ['GITHUB_WORKSPACE']) / '.tools/wlc/target/release' / ('wlc.exe' if os.name == 'nt' else 'wlc')
        with open(os.environ['GITHUB_ENV'], 'a') as output:
            output.write(f'WIRELINK_WLC_EXECUTABLE={executable.as_posix()}\n')
