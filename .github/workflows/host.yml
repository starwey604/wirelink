name: Host CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out Wirelink
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release --prefix ${{ github.workspace }}/install

      - name: Configure package consumer
        run: cmake -S tests/package/consumer -B consumer-build -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install -DCMAKE_BUILD_TYPE=Release

      - name: Build package consumer
        run: cmake --build consumer-build --config Release --parallel

      - name: Test package consumer
        run: ctest --test-dir consumer-build --build-config Release --output-on-failure

      - name: Configure WLC package consumer
        run: cmake -S tests/package/wlc_consumer -B wlc-consumer-build -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install -DCMAKE_BUILD_TYPE=Release

      - name: Build WLC package consumer
        run: cmake --build wlc-consumer-build --config Release --parallel

      - name: Test WLC package consumer
        run: ctest --test-dir wlc-consumer-build --build-config Release --output-on-failure

  short-enum-abi:
    name: Installed ABI (-fshort-enums consumer)
    runs-on: ubuntu-latest

    steps:
      - name: Check out Wirelink
        uses: actions/checkout@v4

      - name: Configure normal library
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build normal library
        run: cmake --build build --config Release --parallel

      - name: Install normal library
        run: >-
          cmake --install build --config Release
          --prefix ${{ github.workspace }}/install

      - name: Configure short-enum package consumer
        run: >-
          cmake -S tests/package/consumer -B consumer-build
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS=-fshort-enums

      - name: Build short-enum package consumer
        run: cmake --build consumer-build --config Release --parallel

      - name: Test short-enum package consumer
        run: >-
          ctest --test-dir consumer-build --build-config Release
          --output-on-failure

  astrial:
    name: Astrial adapter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out Wirelink
        uses: actions/checkout@v4

      - name: Check out Astrial
        uses: actions/checkout@v4
        with:
          repository: starwey604/astrial
          path: astrial

      - name: Install libusb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev

      - name: Install libusb (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DWIRELINK_BUILD_HOST_BENCHMARKS=ON -DWIRELINK_ASTRIAL_SOURCE_DIR=${{ github.workspace }}/astrial -DBUILD_TESTING=ON -DBUILD_EXAMPLE=OFF -DASTRIAL_IO_URING=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DWIRELINK_BUILD_HOST_BENCHMARKS=ON -DWIRELINK_ASTRIAL_SOURCE_DIR=${{ github.workspace }}/astrial -DBUILD_TESTING=ON -DBUILD_EXAMPLE=OFF -DASTRIAL_IO_URING=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_MANIFEST_FEATURES=astrial-usb

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: Astrial adapter (ASan + UBSan)
    runs-on: ubuntu-latest

    steps:
      - name: Check out Wirelink
        uses: actions/checkout@v4

      - name: Check out Astrial
        uses: actions/checkout@v4
        with:
          repository: starwey604/astrial
          path: astrial

      - name: Configure
        run: >-
          cmake -S . -B build
          -DWIRELINK_BUILD_ASTRIAL_ADAPTER=ON
          -DWIRELINK_ASTRIAL_SOURCE_DIR=${{ github.workspace }}/astrial
          -DBUILD_TESTING=ON
          -DBUILD_EXAMPLE=OFF
          -DASTRIAL_IO_URING=OFF
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  fuzz-smoke:
    name: Clang fuzz smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out Wirelink
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DWIRELINK_BUILD_FUZZERS=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang

      - name: Build
        run: cmake --build build --parallel

      - name: Fuzz smoke
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure
