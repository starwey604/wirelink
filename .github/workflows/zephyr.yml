name: Zephyr CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: zephyr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  twister:
    name: Twister unit/native/QEMU
    runs-on: ubuntu-latest

    steps:
      - name: Check out Wirelink
        uses: actions/checkout@v5
        with:
          path: wirelink

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: wirelink
          toolchains: arm-zephyr-eabi:riscv64-zephyr-elf:x86_64-zephyr-elf

      - uses: ./wirelink/.github/actions/setup-wlc

      - name: Apply the qualified platform patches
        shell: bash
        run: |
          zephyr_tree="$(west list zephyr -f '{abspath}')"
          for patch in esp32-uart-rx-timeout esp32s3-rpc-layout dwc2-bulk-zlp; do
            git -C "$zephyr_tree" apply --check "$GITHUB_WORKSPACE/wirelink/adapters/zephyr/patches/$patch.patch"
            git -C "$zephyr_tree" apply "$GITHUB_WORKSPACE/wirelink/adapters/zephyr/patches/$patch.patch"
          done

      - name: Run Twister
        run: >-
          west twister
          -T ${{ github.workspace }}/wirelink/tests/zephyr/unit
          -T ${{ github.workspace }}/wirelink/tests/zephyr/integration
          -p unit_testing
          -p native_sim
          -p qemu_cortex_m3
          -p qemu_riscv32
          -p qemu_x86_64
          --inline-logs
          -x=WIRELINK_WLC_EXECUTABLE=${{ env.WIRELINK_WLC_EXECUTABLE }}
          --outdir twister-out

      - name: Run generated endpoint clock and ownership samples
        run: >-
          west twister
          -T ${{ github.workspace }}/wirelink/samples/zephyr/endpoint_clock
          -T ${{ github.workspace }}/wirelink/samples/zephyr/composed_services
          -T ${{ github.workspace }}/wirelink/samples/zephyr/rpc_usability
          -T ${{ github.workspace }}/wirelink/samples/zephyr/rpc_platform
          -T ${{ github.workspace }}/wirelink/samples/zephyr/session
          -T ${{ github.workspace }}/wirelink/samples/zephyr/udp_validation
          -T ${{ github.workspace }}/wirelink/samples/zephyr/udp_peer
          -p native_sim
          -p qemu_cortex_m3
          -p qemu_riscv32
          -p qemu_x86_64
          -x=WIRELINK_WLC_EXECUTABLE=${{ env.WIRELINK_WLC_EXECUTABLE }}
          --inline-logs
          --outdir twister-endpoint-clock-out

  usb-bulk-esp32s3:
    name: USB bulk sample (ESP32-S3 build)
    runs-on: ubuntu-latest

    steps:
      - name: Check out Wirelink
        uses: actions/checkout@v5
        with:
          path: wirelink

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: wirelink
          toolchains: xtensa-espressif_esp32s3_zephyr-elf
          ccache-cache-key: usb-bulk-esp32s3

      - uses: ./wirelink/.github/actions/setup-wlc

      - name: Apply the qualified platform patches
        shell: bash
        run: |
          zephyr_tree="$(west list zephyr -f '{abspath}')"
          for patch in esp32-uart-rx-timeout esp32s3-rpc-layout dwc2-bulk-zlp; do
            git -C "$zephyr_tree" apply --check "$GITHUB_WORKSPACE/wirelink/adapters/zephyr/patches/$patch.patch"
            git -C "$zephyr_tree" apply "$GITHUB_WORKSPACE/wirelink/adapters/zephyr/patches/$patch.patch"
          done

      - name: Build normal and CPU telemetry samples
        run: >-
          west twister
          -T ${{ github.workspace }}/wirelink/samples/zephyr/usb_bulk
          -p esp32s3_devkitc/esp32s3/procpu
          -s sample.wirelink.usb_bulk
          -s sample.wirelink.usb_bulk.cpu_stats
          --build-only
          --inline-logs
          -x=WIRELINK_WLC_EXECUTABLE=${{ env.WIRELINK_WLC_EXECUTABLE }}
          --outdir twister-usb-bulk-out
