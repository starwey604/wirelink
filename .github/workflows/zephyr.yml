name: Zephyr CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: zephyr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  twister:
    name: Twister unit/native/QEMU
    runs-on: ubuntu-latest

    steps:
      - name: Check out Wirelink
        uses: actions/checkout@v5
        with:
          path: wirelink

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: wirelink
          toolchains: arm-zephyr-eabi:riscv64-zephyr-elf:x86_64-zephyr-elf

      - name: Run Twister
        run: >-
          west twister
          -T ${{ github.workspace }}/wirelink/tests/zephyr/unit
          -T ${{ github.workspace }}/wirelink/tests/zephyr/integration
          -p unit_testing
          -p native_sim
          -p qemu_cortex_m3
          -p qemu_riscv32
          -p qemu_x86_64
          --inline-logs
          --outdir twister-out

      # Exercise the same generated-code sample used for the H7 clock check.
      # Published WLC 0.8.0 / ABI 32 source pair.
      - name: Check out matching standalone WLC
        uses: actions/checkout@v5
        with:
          repository: starwey604/wlc
          ref: 9617907cd24524b10112ce5f0997eebe227d57e7
          path: .tools/wlc

      - name: Build matching WLC
        run: cargo build --release --locked --manifest-path .tools/wlc/Cargo.toml

      - name: Run generated endpoint clock and ownership samples
        run: >-
          west twister
          -T ${{ github.workspace }}/wirelink/samples/zephyr/endpoint_clock
          -T ${{ github.workspace }}/wirelink/samples/zephyr/composed_services
          -T ${{ github.workspace }}/wirelink/samples/zephyr/rpc_usability
          -T ${{ github.workspace }}/wirelink/samples/zephyr/rpc_platform
          -T ${{ github.workspace }}/wirelink/samples/zephyr/session
          -T ${{ github.workspace }}/wirelink/samples/zephyr/udp_validation
          -T ${{ github.workspace }}/wirelink/samples/zephyr/udp_peer
          -p native_sim
          -p qemu_cortex_m3
          -p qemu_riscv32
          -p qemu_x86_64
          -x=WIRELINK_WLC_AUTO_DOWNLOAD=OFF
          -x=WIRELINK_WLC_EXECUTABLE=${{ github.workspace }}/.tools/wlc/target/release/wlc
          --inline-logs
          --outdir twister-endpoint-clock-out

  usb-bulk-esp32s3:
    name: USB bulk sample (ESP32-S3 build)
    runs-on: ubuntu-latest

    steps:
      - name: Check out Wirelink
        uses: actions/checkout@v5
        with:
          path: wirelink

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: wirelink
          toolchains: xtensa-espressif_esp32s3_zephyr-elf
          ccache-cache-key: usb-bulk-esp32s3

      - name: Build normal and CPU telemetry samples
        run: >-
          west twister
          -T ${{ github.workspace }}/wirelink/samples/zephyr/usb_bulk
          -p esp32s3_devkitc/esp32s3/procpu
          -s sample.wirelink.usb_bulk
          -s sample.wirelink.usb_bulk.cpu_stats
          --build-only
          --inline-logs
          --outdir twister-usb-bulk-out
