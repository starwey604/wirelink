# SPDX-License-Identifier: Apache-2.0
sample:
  name: Wirelink typed RPC ownership
  description: Four-call admission, owned values, chaining, physical leases and deadlines
common:
  tags: [wirelink, wlc, rpc]
  platform_allow: [native_sim, qemu_cortex_m3, qemu_riscv32, qemu_x86_64]
  integration_platforms: [native_sim, qemu_cortex_m3, qemu_riscv32, qemu_x86_64]
  timeout: 60
  harness: console
  harness_config:
    type: one_line
    regex: ['RPC_OWNERSHIP ALL PASS']
tests:
  sample.wirelink.rpc_usability: {}
