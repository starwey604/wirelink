# SPDX-License-Identifier: Apache-2.0

sample:
  name: Wirelink USB vendor bulk endpoint
  description: Full-duplex Wirelink endpoint over an interrupt-driven USB class
tests:
  sample.wirelink.usb_bulk:
    build_only: true
    platform_allow:
      - esp32s3_devkitc/esp32s3/procpu
    tags:
      - usb
      - wirelink
  sample.wirelink.usb_bulk.cpu_stats:
    build_only: true
    platform_allow:
      - esp32s3_devkitc/esp32s3/procpu
    extra_conf_files:
      - cpu_stats.conf
    tags:
      - usb
      - wirelink
      - benchmark
