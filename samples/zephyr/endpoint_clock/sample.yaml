# SPDX-License-Identifier: Apache-2.0
sample:
  name: Wirelink generated endpoint clock
  description: Explicit owner uptime clock and zero core clock reads over packet loopback
tests:
  sample.wirelink.endpoint_clock:
    tags:
      - wirelink
      - wlc
      - rpc
    platform_allow:
      - native_sim
      - qemu_cortex_m3
      - qemu_riscv32
      - qemu_x86_64
    integration_platforms:
      - native_sim
      - qemu_cortex_m3
      - qemu_riscv32
      - qemu_x86_64
    timeout: 30
    harness: console
    harness_config:
      type: one_line
      regex: ['CLOCK_CHECK ALL PASS']
