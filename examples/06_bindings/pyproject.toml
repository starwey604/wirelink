# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["scikit-build-core>=1.0,<2", "nanobind>=3.0,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "wirelink-calculator-sdk"
version = "0.1.0.dev1"
description = "Reference synchronous Python/C++ SDK for the Wirelink calculator schema"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE", "licenses/*"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/calculator_sdk"]
install.components = ["python"]
sdist.include = ["generated/**", "python/**", "include/**", "src/**", "cmake/**", "tests/**", "schema/**", "licenses/**", "CMakeLists.txt", "README.md", "LICENSE", "pyproject.toml"]
sdist.exclude = ["build/**", "dist/**", ".pytest_cache/**", "**/__pycache__/**"]

[tool.scikit-build.cmake.define]
CALCULATOR_BUILD_PYTHON = "ON"
BUILD_TESTING = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests"]
