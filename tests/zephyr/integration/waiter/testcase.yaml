tests:
  wirelink.waiter.timeout32:
    tags: [wirelink, rpc, integration]
    harness: ztest
    platform_allow: [native_sim/native/64]
    extra_configs:
      - CONFIG_TIMEOUT_64BIT=n
      - CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
  wirelink.waiter.integration:
    tags: [wirelink, rpc, integration]
    harness: ztest
    integration_platforms: [native_sim, native_sim/native/64, qemu_cortex_m3, qemu_riscv32, qemu_x86_64]
    platform_allow: [native_sim, native_sim/native/64, qemu_cortex_m3, qemu_riscv32, qemu_x86_64]
